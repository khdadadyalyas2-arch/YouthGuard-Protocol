<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouthGuard Protocol | Decentralized AI & ZK-Compliance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0e17;
            --panel-bg: #121926;
            --accent-cyan: #00ffcc;
            --accent-purple: #7928ca;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 20px 10px; }
        .wrapper { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

        .header {
            background: linear-gradient(135deg, rgba(121,40,202,0.15), rgba(0,255,204,0.05));
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 20px;
            text-align: center;
        }
        .header h1 { font-size: 1.4rem; color: var(--accent-cyan); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .header p { font-size: 0.8rem; color: var(--text-dim); margin-top: 6px; }
        .badge { display: inline-block; background: rgba(0,255,204,0.15); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); font-size: 0.7rem; padding: 3px 10px; border-radius: 20px; margin-top: 8px; font-weight: bold; }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
        }
        .card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; color: var(--text-main); }

        .wallet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn:hover { background: rgba(255,255,255,0.12); }
        .btn-evm { border-color: var(--accent-blue); color: var(--accent-blue); }
        .btn-sol { border-color: var(--accent-purple); color: #c084fc; }
        .wallet-info { font-size: 0.75rem; text-align: center; margin-top: 10px; color: var(--accent-cyan); font-family: monospace; word-break: break-all; }

        /* ZK Generator */
        .zk-box { background: rgba(0,0,0,0.3); border-radius: 10px; padding: 12px; border: 1px dashed var(--border-color); }
        .btn-action { background: linear-gradient(135deg, #00ffcc, #00b4d8); color: #000; font-weight: bold; border: none; width: 100%; padding: 12px; border-radius: 10px; cursor: pointer; margin-top: 10px; font-size: 0.85rem; }
        .hash-output { font-family: monospace; font-size: 0.7rem; color: #38bdf8; word-break: break-all; margin-top: 8px; line-height: 1.4; display: none; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 6px; }

        /* SentinAI Realtime Analyzer */
        .scanner-bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; margin: 10px 0; }
        .scanner-fill { height: 100%; width: 0%; background: var(--accent-cyan); transition: width 0.4s ease; }
        .risk-tag { font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; display: inline-block; font-weight: bold; }
        .risk-safe { background: rgba(16,185,129,0.15); color: var(--success); border: 1px solid var(--success); }

        .terminal { background: #05080f; border-radius: 10px; padding: 12px; font-family: monospace; font-size: 0.75rem; color: #94a3b8; max-height: 150px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.05); }
        .log-cyan { color: var(--accent-cyan); }
        .log-green { color: var(--success); }
        
        .footer { text-align: center; font-size: 0.7rem; color: var(--text-dim); }
        .footer a { color: var(--accent-cyan); text-decoration: none; }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- Header -->
    <div class="header">
        <h1>
